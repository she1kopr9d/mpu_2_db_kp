services:
  mysql-db:
    image: mysql:8.0
    container_name: kafedra_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kafedra_db
      MYSQL_USER: kafedra_user
      MYSQL_PASSWORD: kafedra_password
    ports:
      - "3306:3306"
    volumes:
      - ../database/scripts:/docker-entrypoint-initdb.d
      - ../database/data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    container_name: kafedra_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql-db:
        condition: service_healthy
    mem_limit: 256m
